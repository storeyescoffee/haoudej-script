[mysql]
host = 127.0.0.1
port = 3306
user = root
password = 12345
database = CHANGE_ME
# Fallback if host stops answering: resolve the till by MAC on the local subnet.
mac = 30:0e:d5:34:70:2e
connect_timeout = 10

[query]
tva = 10
# Column used for date filtering and ordering (date_creation or date_update, etc.)
date_col = date_creation
output = /var/lib/haoudej/results.csv

[api]
url = http://app.storeyes.io:9000/process
api_key =
field = file
timeout = 120
# device_id: leave blank to auto-derive from the Pi serial number.
device_id =
